<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohsem BM – Minggu 4: Exam Bulan 1</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
/* PERLINDUNGAN */
body{-webkit-user-select:none;-moz-user-select:none;user-select:none;}
input,textarea{-webkit-user-select:text!important;user-select:text!important;}
:root{
  --or:#FF6B35;--yl:#FFD23F;--gr:#06D6A0;
  --pu:#7B5EA7;--bl:#118AB2;--pk:#FF6B9D;
  --gold:#F59E0B;--gold2:#D97706;
  --bg:#FFF9F0;--text:#2D2D2D;--muted:#999;
  --rad:18px;--shad:0 6px 24px rgba(0,0,0,.09);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* HEADER */
.hdr{background:linear-gradient(135deg,#1A1A2E 0%,#2D1B69 50%,#7B5EA7 100%);padding:22px 16px 16px;text-align:center;position:relative;overflow:hidden;}
.hdr::before{content:'';position:absolute;top:-50px;right:-30px;width:160px;height:160px;background:rgba(245,158,11,.15);border-radius:50%;}
.hdr::after{content:'';position:absolute;bottom:-30px;left:-20px;width:100px;height:100px;background:rgba(255,210,63,.1);border-radius:50%;}
.hdr .badge{display:inline-block;background:rgba(245,158,11,.3);color:var(--yl);font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;padding:3px 12px;border-radius:20px;margin-bottom:6px;border:1px solid rgba(245,158,11,.4);}
.hdr h1{font-family:'Fredoka One',cursive;font-size:28px;color:white;text-shadow:0 3px 10px rgba(0,0,0,.3);line-height:1.1;}
.hdr h1 span{color:var(--yl);}
.hdr p{color:rgba(255,255,255,.85);font-size:13px;font-weight:700;margin-top:4px;}

/* TROPHY ROW */
.trophy-row{display:flex;justify-content:center;gap:12px;margin-top:12px;}
.trophy-item{background:rgba(255,255,255,.1);border:1px solid rgba(255,210,63,.3);border-radius:12px;padding:8px 14px;text-align:center;}
.trophy-item .ti-icon{font-size:20px;}
.trophy-item .ti-label{font-size:10px;font-weight:800;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

/* DAY PICKER */
.daypick{background:white;padding:12px 16px;border-bottom:2px solid #F0E8D8;}
.daypick-label{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.days-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
.day-btn{flex-shrink:0;width:44px;height:54px;border-radius:14px;border:2px solid #E8E0D0;background:white;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .15s;font-family:'Nunito',sans-serif;}
.day-btn .d-num{font-size:16px;font-weight:900;color:var(--muted);}
.day-btn .d-lbl{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.day-btn.active{background:var(--pu);border-color:var(--pu);}
.day-btn.active .d-num,.day-btn.active .d-lbl{color:white;}
.day-btn.done{background:#E8FBF5;border-color:var(--gr);}
.day-btn.done .d-num{color:var(--gr);}
.day-btn.exam-day{border-color:var(--gold);background:linear-gradient(135deg,#FEF3C7,#FFF8E1);}
.day-btn.exam-day .d-num{color:var(--gold2);}

/* PROGRESS */
.prog-wrap{padding:10px 16px;background:white;border-bottom:2px solid #F0E8D8;}
.prog-label{display:flex;justify-content:space-between;margin-bottom:6px;}
.prog-label span{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.prog-label strong{font-size:12px;font-weight:900;color:var(--pu);}
.prog-track{background:#F0E8D8;border-radius:10px;height:10px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--pu),var(--gold));border-radius:10px;transition:width .6s;}

/* CONTENT */
.content{padding:16px;}
.card{background:white;border-radius:var(--rad);padding:18px;margin-bottom:14px;box-shadow:var(--shad);}
.card-title{font-family:'Fredoka One',cursive;font-size:17px;color:var(--pu);margin-bottom:12px;display:flex;align-items:center;gap:8px;}

/* REVIEW CARDS */
.review-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0;}
.review-card{border-radius:14px;padding:14px;border-left:5px solid;}
.rc-1{background:#FFF0EB;border-color:var(--or);}
.rc-2{background:#EEF4FF;border-color:var(--bl);}
.rc-3{background:#E8FBF5;border-color:var(--gr);}
.rc-title{font-family:'Fredoka One',cursive;font-size:15px;margin-bottom:6px;}
.rc-1 .rc-title{color:var(--or);}
.rc-2 .rc-title{color:var(--bl);}
.rc-3 .rc-title{color:var(--gr);}
.rc-eg{font-size:13px;font-weight:700;color:var(--text);line-height:1.6;}
.hl{background:var(--yl);border-radius:4px;padding:0 4px;color:#333;}
.hl-di{background:#E8FBF5;border-radius:4px;padding:0 4px;color:#065F46;}
.hl-a{background:#EEF4FF;border-radius:4px;padding:0 4px;color:#1E40AF;}

/* SIB CHIPS */
.sib-mini{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.sib-chip{border-radius:10px;padding:6px 10px;font-size:12px;font-weight:800;}
.sc-si{background:#FFF0EB;color:#FF6B35;}
.sc-bu{background:#FFF8E1;color:#F59E0B;}
.sc-di{background:#E8FBF5;color:#059669;}
.sc-a{background:#EEF4FF;color:#2563EB;}
.sc-m{background:#F3EEFF;color:#7B5EA7;}

/* Q WRAP */
.q-wrap{margin-bottom:16px;}
.q-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:900;color:white;background:var(--pu);margin-right:8px;flex-shrink:0;}
.q-text{font-size:14px;font-weight:700;line-height:1.6;margin-bottom:8px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.opt{padding:9px 8px;border:2px solid #E8E0D0;border-radius:12px;background:white;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;text-align:center;line-height:1.4;}
.opt:hover{border-color:var(--pu);background:#F3EEFF;}
.opt.cor{border-color:var(--gr);background:#E8FBF5;color:#065F46;}
.opt.wrg{border-color:#EF4444;background:#FEF2F2;color:#991B1B;}
.fb{font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;margin-top:6px;display:none;}
.fb.cor{background:#D1FAE5;color:#065F46;display:block;}
.fb.wrg{background:#FEE2E2;color:#991B1B;display:block;}
.wi{width:100%;border:2px solid #E8E0D0;border-radius:12px;padding:10px 14px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;outline:none;transition:border-color .2s;margin-top:6px;}
.wi:focus{border-color:var(--pu);}
.wi.cor{border-color:var(--gr);background:#E8FBF5;}
.wi.wrg{border-color:#EF4444;background:#FEF2F2;}
.tip{background:#F3EEFF;border-left:4px solid var(--pu);border-radius:0 12px 12px 0;padding:12px;margin:10px 0;font-size:13px;font-weight:600;color:#4A3870;line-height:1.6;}
.tip strong{color:var(--pu);}

/* TIMER */
.timer-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.timer-box{background:linear-gradient(135deg,var(--pu),var(--gold));color:white;border-radius:12px;padding:8px 16px;font-family:'Fredoka One',cursive;font-size:22px;min-width:70px;text-align:center;}
.timer-label{font-size:12px;font-weight:800;color:var(--muted);}
.timer-start{padding:8px 16px;background:var(--pu);color:white;border:none;border-radius:12px;font-family:'Fredoka One',cursive;font-size:15px;cursor:pointer;}

/* SCORE PANEL */
.score-panel{border-radius:var(--rad);padding:22px;text-align:center;margin-bottom:14px;display:none;animation:popIn .4s cubic-bezier(.34,1.56,.64,1);}
.score-panel.show{display:block;}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.sp-emoji{font-size:50px;display:block;margin-bottom:6px;}
.sp-num{font-family:'Fredoka One',cursive;font-size:44px;line-height:1;}
.sp-label{font-size:13px;font-weight:700;opacity:.85;margin-top:4px;}
.stars-earned{display:flex;justify-content:center;gap:8px;margin:12px 0;}
.star-item{font-size:28px;filter:grayscale(1) opacity(.3);transition:filter .4s;}
.star-item.lit{filter:none;animation:starPop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes starPop{from{transform:scale(0)}to{transform:scale(1)}}
.sp-msg{font-size:16px;font-weight:800;margin-top:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.25);}
.sp-bar{height:12px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.25);margin-top:14px;}
.sp-fill{height:100%;background:var(--yl);border-radius:10px;transition:width 1s;}

/* BUTTONS */
.btn-main{width:100%;padding:15px;border:none;border-radius:var(--rad);font-family:'Fredoka One',cursive;font-size:19px;color:white;cursor:pointer;transition:transform .12s;margin-top:6px;}
.btn-pu{background:linear-gradient(135deg,var(--pu),var(--bl));box-shadow:0 6px 20px rgba(123,94,167,.3);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 6px 20px rgba(245,158,11,.35);}
.btn-gr{background:linear-gradient(135deg,var(--gr),#059669);box-shadow:0 6px 20px rgba(6,214,160,.3);}
.btn-or{background:linear-gradient(135deg,var(--or),#FF8C42);box-shadow:0 6px 20px rgba(255,107,53,.3);}
.btn-wa{background:linear-gradient(135deg,#25D366,#128C7E);box-shadow:0 6px 20px rgba(37,211,102,.25);}
.btn-main:hover{transform:translateY(-2px);}

/* QUOTE */
.quote-box{background:linear-gradient(135deg,#F3EEFF,#FFF8E1);border-radius:14px;padding:14px;text-align:center;margin:10px 0;}
.quote-text{font-size:13px;font-weight:700;color:var(--pu);font-style:italic;line-height:1.6;}
.quote-auth{font-size:11px;font-weight:900;color:var(--muted);margin-top:6px;}

/* EXAM SPECIAL */
.exam-banner{background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:var(--rad);padding:20px;text-align:center;margin-bottom:14px;color:white;}
.exam-banner h2{font-family:'Fredoka One',cursive;font-size:24px;}
.exam-banner p{font-size:13px;font-weight:700;opacity:.9;margin-top:4px;}
.exam-steps{display:flex;flex-direction:column;gap:10px;margin:14px 0;}
.exam-step{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.2);border-radius:12px;padding:12px;}
.es-num{width:32px;height:32px;border-radius:50%;background:white;color:var(--gold2);font-family:'Fredoka One',cursive;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.es-text{font-size:13px;font-weight:700;}

/* UPGRADE SECTION */
.upgrade-section{background:linear-gradient(135deg,#1A1A2E,#2D1B69);border-radius:var(--rad);padding:22px;margin-bottom:14px;text-align:center;color:white;}
.upgrade-badge{display:inline-block;background:var(--yl);color:#1A1A2E;font-family:'Fredoka One',cursive;font-size:14px;padding:4px 16px;border-radius:20px;margin-bottom:12px;}
.upgrade-title{font-family:'Fredoka One',cursive;font-size:24px;color:var(--yl);margin-bottom:8px;}
.upgrade-desc{font-size:13px;font-weight:700;color:rgba(255,255,255,.8);line-height:1.7;margin-bottom:16px;}
.upgrade-features{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.uf-item{background:rgba(255,255,255,.1);border-radius:12px;padding:10px;text-align:left;font-size:12px;font-weight:700;}
.uf-item .uf-icon{font-size:20px;display:block;margin-bottom:4px;}
.price-tag{font-family:'Fredoka One',cursive;font-size:36px;color:var(--yl);}
.price-sub{font-size:12px;font-weight:700;color:rgba(255,255,255,.6);margin-top:2px;}
.price-ori{font-size:14px;font-weight:700;color:rgba(255,255,255,.4);text-decoration:line-through;margin-bottom:8px;}

/* WAYGROUND BOX */
.wayground-box{background:linear-gradient(135deg,#EEF4FF,#F3EEFF);border-radius:14px;padding:16px;margin:14px 0;border:2px solid var(--pu);}
.wb-title{font-family:'Fredoka One',cursive;font-size:16px;color:var(--pu);margin-bottom:8px;}
.wb-list{list-style:none;font-size:13px;font-weight:700;color:var(--text);}
.wb-list li{padding:4px 0;display:flex;align-items:center;gap:8px;}
.wb-list li::before{content:'✅';font-size:11px;}

/* CERT */
.cert{background:white;border-radius:var(--rad);padding:28px 20px;text-align:center;position:relative;overflow:hidden;margin-bottom:14px;}
.cert-border{position:absolute;top:0;left:0;right:0;bottom:0;border:6px solid transparent;border-radius:var(--rad);background:linear-gradient(white,white) padding-box,linear-gradient(135deg,var(--gold),var(--pu),var(--or),var(--gold)) border-box;}
.cert::before{content:'';position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,var(--gold),var(--pu),var(--or),var(--gr),var(--bl),var(--gold));}
.cert-logo{font-size:56px;margin-bottom:8px;display:block;}
.cert-title{font-family:'Fredoka One',cursive;font-size:26px;color:var(--gold2);}
.cert-subtitle{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:4px 0 16px;}
.cert-month{font-family:'Fredoka One',cursive;font-size:18px;color:var(--pu);background:#F3EEFF;border-radius:10px;padding:6px 16px;display:inline-block;margin-bottom:12px;}
.cert-name{font-family:'Fredoka One',cursive;font-size:28px;color:var(--text);border-bottom:3px solid var(--gold);display:inline-block;padding:0 20px 4px;margin:8px 0;}
.cert-desc{font-size:13px;font-weight:700;color:#555;line-height:1.7;margin:12px 0 16px;}
.cert-badges{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap;}
.cert-badge{border-radius:12px;padding:7px 12px;font-size:11px;font-weight:800;}
.cb1{background:#FEF3C7;color:#B45309;}
.cb2{background:#F3EEFF;color:var(--pu);}
.cb3{background:#E8FBF5;color:#065F46;}
.cb4{background:#FFF0EB;color:var(--or);}
.cert-stars{font-size:32px;margin:8px 0;letter-spacing:6px;}
.cert-footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:20px;padding-top:16px;border-top:1px dashed #F0E8D8;}
.cert-sign{text-align:center;}
.cert-sign .cs-line{border-bottom:2px solid #C4A8E0;width:120px;margin:0 auto 4px;height:28px;}
.cert-sign .cs-name{font-size:11px;font-weight:900;color:var(--muted);}
.name-input{width:100%;border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;outline:none;text-align:center;}

/* REPORT */
.rpt-hdr{background:linear-gradient(135deg,var(--pu),var(--gold2));padding:20px;text-align:center;border-radius:var(--rad) var(--rad) 0 0;color:white;}
.rpt-hdr h2{font-family:'Fredoka One',cursive;font-size:20px;}
.rpt-body{background:white;border-radius:0 0 var(--rad) var(--rad);padding:18px;}
.rpt-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed #F0E8D8;font-size:13px;}
.rpt-row:last-child{border-bottom:none;}
.rpt-key{font-weight:700;color:var(--muted);}
.rpt-val{font-weight:900;}
.grade-tag{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:900;font-size:12px;}
.gA{background:#D1FAE5;color:#065F46;}.gB{background:#DBEAFE;color:#1E40AF;}
.gC{background:#FEF3C7;color:#92400E;}.gD{background:#FEE2E2;color:#991B1B;}
.skill-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
.sk{border-radius:12px;padding:10px;}
.sk-si{background:#FFF0EB;}.sk-bu{background:#FFF8E1;}.sk-di{background:#E8FBF5;}.sk-am{background:#EEF4FF;}
.sk .si{font-size:18px;}.sk .sn{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;margin:3px 0 5px;}
.sk .sb{background:#F0F0F0;border-radius:8px;height:7px;overflow:hidden;}
.sk .sf{height:100%;border-radius:8px;}
.sf-si{background:var(--or);}.sf-bu{background:#F59E0B;}.sf-di{background:var(--gr);}.sf-am{background:#2563EB;}
.note-box{background:#F3EEFF;border-left:4px solid var(--pu);border-radius:0 12px 12px 0;padding:12px;margin-top:12px;font-size:12px;font-weight:600;color:#4A3870;line-height:1.6;}
.note-box strong{color:var(--pu);}

/* CONF */
.conf-wrap{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1000;display:none;}
.conf-p{position:absolute;border-radius:2px;animation:confFall 3s ease-in forwards;}
@keyframes confFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="conf-wrap" id="confWrap"></div>

<!-- HEADER -->
<div class="hdr">
  <div class="badge">🏆 Ohsem BM – Tahun 1 & 2 · Minggu 4</div>
  <h1>Exam <span>Bulan 1</span> 🎓</h1>
  <p>Ulang Kaji + Exam Online + Sijil Bulan 1</p>
  <div class="trophy-row">
    <div class="trophy-item"><div class="ti-icon">📖</div><div class="ti-label">Ulang Kaji</div></div>
    <div class="trophy-item"><div class="ti-icon">🎯</div><div class="ti-label">Exam</div></div>
    <div class="trophy-item"><div class="ti-icon">🏅</div><div class="ti-label">Sijil Bulan 1</div></div>
    <div class="trophy-item"><div class="ti-icon">⭐⭐⭐</div><div class="ti-label">3 Minggu</div></div>
  </div>
</div>

<!-- DAY PICKER -->
<div class="daypick">
  <div class="daypick-label">Pilih Hari</div>
  <div class="days-row" id="daysRow"></div>
</div>

<!-- PROGRESS -->
<div class="prog-wrap">
  <div class="prog-label">
    <span>Kemajuan Minggu 4</span>
    <strong id="weekPct">0%</strong>
  </div>
  <div class="prog-track"><div class="prog-fill" id="weekFill" style="width:0%"></div></div>
</div>

<div class="content" id="mainContent"></div>

<script>
let currentDay=1;
let dayScores={1:null,2:null,3:null,4:null,5:null,6:null,7:null};
let quizAnswers={};
let quizDone=false;
let timerInterval=null;
let timerSec=300;
let timerRunning=false;
let studentName='';

const dayConfig=[
  {day:1,label:'Isnin',icon:'📖',title:'Ulang Kaji Minggu 1'},
  {day:2,label:'Selasa',icon:'📖',title:'Ulang Kaji Minggu 2'},
  {day:3,label:'Rabu',icon:'📖',title:'Ulang Kaji Minggu 3'},
  {day:4,label:'Khamis',icon:'✏️',title:'Latihan Gabungan'},
  {day:5,label:'Jumaat',icon:'🎯',title:'Exam Online'},
  {day:6,label:'Sabtu',icon:'🏆',title:'Kuiz OHSEM Kamu!'},
  {day:7,label:'Ahad',icon:'🏅',title:'Sijil Bulan 1'},
];

const quotes=[
  {text:'"Ulang kaji adalah kunci kejayaan. Kamu boleh!"',auth:'— Cikgu Zainal'},
  {text:'"Setiap kali kamu ulang kaji, ilmu itu makin sebati dalam hati."',auth:'— Mutiara Kata'},
  {text:'"Tiga minggu dah berlalu. Kamu dah belajar banyak!"',auth:'— Cikgu Zainal'},
  {text:'"Latihan menjadi sempurna. Teruskan usaha kamu!"',auth:'— Mutiara Kata'},
  {text:'"Ini hari exam! Tunjukkan semua yang kamu dah belajar!"',auth:'— Cikgu Zainal'},
  {text:'"Kuiz terakhir bulan ini. Kamu pasti boleh!"',auth:'— Cikgu Zainal'},
  {text:'"Tahniah! Kamu telah selesai Bulan 1 Ohsem BM!"',auth:'— Cikgu Zainal'},
];

function renderDayPicker(){
  document.getElementById('daysRow').innerHTML=dayConfig.map(d=>{
    let cls='day-btn';
    if(d.day===currentDay) cls+=' active';
    else if(dayScores[d.day]!==null) cls+=' done';
    else if(d.day===5) cls+=' exam-day';
    return `<button class="${cls}" onclick="switchDay(${d.day})">
      <span class="d-num">${dayScores[d.day]!==null?'✅':d.day===5?'🎯':d.day}</span>
      <span class="d-lbl">${d.label}</span>
    </button>`;
  }).join('');
}

function renderWeekProgress(){
  const done=Object.values(dayScores).filter(v=>v!==null).length;
  const pct=Math.round((done/7)*100);
  document.getElementById('weekPct').textContent=pct+'%';
  document.getElementById('weekFill').style.width=pct+'%';
}

function switchDay(d){
  currentDay=d;quizAnswers={};quizDone=false;stopTimer();
  renderDayPicker();renderWeekProgress();renderContent();
  window.scrollTo({top:0,behavior:'smooth'});
}

function startTimer(){
  if(timerRunning) return;
  timerSec=300;timerRunning=true;
  timerInterval=setInterval(()=>{timerSec--;updateTimerDisplay();if(timerSec<=0) stopTimer();},1000);
  const btn=document.querySelector('.timer-start');
  if(btn) btn.textContent='Sedang berjalan...';
}
function stopTimer(){clearInterval(timerInterval);timerRunning=false;}
function updateTimerDisplay(){
  const el=document.getElementById('timerDisplay');
  if(!el) return;
  const m=Math.floor(timerSec/60),s=timerSec%60;
  el.textContent=m+':'+String(s).padStart(2,'0');
  if(timerSec<=60) el.style.color='#EF4444';
}

function selectOpt(btn,qid,chosen,correct){
  const parent=btn.closest('.q-wrap');
  parent.querySelectorAll('.opt').forEach(b=>b.classList.remove('cor','wrg'));
  const fb=document.getElementById('fb-'+qid);
  if(chosen===correct){
    btn.classList.add('cor');fb.textContent='✅ Betul! Hebat!';fb.className='fb cor';
    quizAnswers[qid]=true;
  } else {
    btn.classList.add('wrg');fb.textContent='❌ Jawapan: '+correct;fb.className='fb wrg';
    parent.querySelectorAll('.opt').forEach(b=>{
      if(b.textContent.trim()===correct||b.textContent.includes(correct)) b.classList.add('cor');
    });
    quizAnswers[qid]=false;
  }
}

function checkWrite(inp,accepted,qid){
  const val=inp.value.toLowerCase().trim();
  const fb=document.getElementById('fb-'+qid);
  if(!val) return;
  const ok=accepted.some(a=>val.includes(a.toLowerCase()));
  if(ok){
    inp.classList.add('cor');inp.classList.remove('wrg');
    if(fb){fb.innerHTML='✅ Bagus! Jawapan diterima!';fb.className='fb cor';}
    quizAnswers[qid]=true;
    const rb=document.getElementById('retry-'+qid);if(rb) rb.remove();
  } else if(val.length>2){
    inp.classList.add('wrg');inp.classList.remove('cor');
    if(fb){fb.innerHTML='💡 Cuba lagi! Contoh: <strong>'+accepted[0]+'</strong>';fb.className='fb wrg';}
    quizAnswers[qid]=false;
    if(!document.getElementById('retry-'+qid)){
      const rb=document.createElement('button');rb.id='retry-'+qid;rb.textContent='🔄 Cuba Semula';
      rb.style.cssText='margin-top:6px;padding:7px 14px;background:#F3EEFF;border:2px solid var(--pu);border-radius:10px;font-family:Nunito,sans-serif;font-size:12px;font-weight:800;color:var(--pu);cursor:pointer;width:100%;';
      rb.onclick=()=>{inp.value='';inp.classList.remove('wrg','cor');if(fb){fb.className='fb';fb.textContent='';}rb.remove();inp.focus();};
      fb.parentNode.insertBefore(rb,fb.nextSibling);
    }
  }
}

function submitDay(dayNum){
  const trues=Object.values(quizAnswers).filter(Boolean).length;
  const total=Object.keys(quizAnswers).length||1;
  const pct=Math.round((trues/total)*100);
  dayScores[dayNum]=pct;quizDone=true;
  const sp=document.getElementById('scorePanel');
  if(sp){
    sp.classList.add('show');
    document.getElementById('sp-num').textContent=trues+'/'+total;
    document.getElementById('sp-fill').style.width=pct+'%';
    let emoji,msg;
    if(pct>=90){emoji='🏆';msg='LUAR BIASA! Kamu bersedia untuk Exam!';}
    else if(pct>=70){emoji='🌟';msg='Bagus! Ulang kaji lagi untuk mantapkan!';}
    else if(pct>=50){emoji='👍';msg='Usaha yang baik! Cuba lagi sebelum Exam!';}
    else{emoji='💪';msg='Ulang kaji lagi ya! Kamu boleh!';}
    document.getElementById('sp-emoji').textContent=emoji;
    document.getElementById('sp-msg').textContent=msg;
    document.querySelectorAll('.star-item').forEach((s,i)=>{
      if(i<(pct>=90?3:pct>=70?2:1)) setTimeout(()=>s.classList.add('lit'),(i+1)*300);
    });
    if(pct>=70) launchConf();
  }
  stopTimer();renderDayPicker();renderWeekProgress();
  const nb=document.getElementById('nextDayBtn');if(nb) nb.style.display='block';
  const sb=document.getElementById('submitBtn');if(sb) sb.style.display='none';
}

function generateReport(){
  const scores=Object.values(dayScores).filter(v=>v!==null);
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
  document.getElementById('rpt-avg').textContent=avg+'%';
  const grade=avg>=90?'A+':avg>=80?'A':avg>=70?'B+':avg>=60?'B':avg>=50?'C':'D';
  const gradeEl=document.getElementById('rpt-grade');
  gradeEl.textContent=grade;
  gradeEl.className='grade-tag '+(avg>=70?'gA':avg>=60?'gB':avg>=50?'gC':'gD');
  document.getElementById('rpt-days').textContent=scores.length+' / 7 hari';
  document.getElementById('rpt-date').textContent=new Date().toLocaleDateString('ms-MY',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('sf-si').style.width=Math.min(avg+10,100)+'%';
  document.getElementById('sf-bu').style.width=Math.min(avg+5,100)+'%';
  document.getElementById('sf-di').style.width=Math.max(avg,20)+'%';
  document.getElementById('sf-am').style.width=Math.max(avg-5,20)+'%';
  let note;
  if(avg>=80) note='Tahniah! Anak anda telah <strong>menguasai Bulan 1</strong> dengan cemerlang. Sangat bersedia untuk Bulan 2!';
  else if(avg>=60) note='Anak anda menunjukkan <strong>kemajuan yang baik</strong>. Galakkan ulang kaji sebelum ke Bulan 2.';
  else note='Anak anda perlu <strong>lebih banyak latihan</strong>. Sila ulang Minggu 1-3 sebelum teruskan.';
  document.getElementById('rpt-note').innerHTML='<strong>💬 Nota Cikgu:</strong><br>'+note;
}

// ── AFFILIATE FUNCTIONS ──
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxUCkJrg3PPBXpATBw4q8lLZsKYJNDaOKiu6x8xpyKcuwVszsBg3mm9CTdcQuRmS8TM/exec';
let affiliateDiskaun=0;
let affiliateKodSah='';

function semakKodAffiliate(){
  const kod=document.getElementById('kodAffiliate').value.trim().toUpperCase();
  const msg=document.getElementById('affiliateMsg');
  msg.style.display='none';
  if(!kod){msg.style.cssText='display:block;background:#FEE2E2;color:#991B1B;';msg.textContent='Sila masukkan kod terlebih dahulu.';return;}

  // Semak dengan Apps Script
  fetch(SCRIPT_URL,{
    method:'POST',mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'semakKod',kod:kod})
  }).catch(()=>{});

  // Kod yang sah — Cikgu boleh tambah lebih
  const kodSah=['ROIHAN-MEI','SARAH-JUN','NORA-MEI','FARID-MEI'];
  if(kodSah.includes(kod)||kod.length>=8){
    affiliateDiskaun=5;
    affiliateKodSah=kod;
    msg.style.cssText='display:block;background:#D1FAE5;color:#065F46;';
    msg.textContent='✅ Kod sah! Anda mendapat diskaun RM5!';
    // Update harga
    document.getElementById('hargaAsasFinal').textContent='RM10';
    document.getElementById('hargaPremiumFinal').textContent='RM20';
  } else {
    affiliateDiskaun=0;
    msg.style.cssText='display:block;background:#FEE2E2;color:#991B1B;';
    msg.textContent='❌ Kod tidak sah. Cuba semula atau hubungi Cikgu Zainal.';
  }
}

function beliPakej(pakej){
  const nm=studentName||'Ibu/Bapa';
  const hargaAsal=pakej==='premium'?25:15;
  const hargaBayar=hargaAsal-affiliateDiskaun;
  const kodRef=affiliateKodSah||'Tiada';

  // Log ke Apps Script
  fetch(SCRIPT_URL,{
    method:'POST',mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      action:'beliPakej',
      namaWali:nm,telefon:'',
      pakej:pakej,kodReferral:kodRef
    })
  }).catch(()=>{});

  // WA mesej ke Cikgu
  const msg=encodeURIComponent(
    '🛒 *Saya mahu langgan Ohsem BM!*\n\n'+
    '👦 Nama murid: '+studentName+'\n'+
    '📦 Pakej: '+(pakej==='premium'?'PREMIUM':'ASAS')+'\n'+
    '💰 Harga: RM'+hargaBayar+
    (affiliateDiskaun>0?' (Diskaun RM'+affiliateDiskaun+' – Kod: '+kodRef+')\n':'\n')+
    '\nSila sahkan pembayaran dan hantar kod unlock. Terima kasih! 🙏'
  );
  window.open('https://wa.me/60132372636?text='+msg,'_blank');
}

// ── INIT ──
renderDayPicker();
renderWeekProgress();
renderContent();
</script>
