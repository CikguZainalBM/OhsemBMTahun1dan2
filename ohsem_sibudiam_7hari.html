<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohsem BM – SiBuDiAM 7 Hari</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root {
  --or: #FF6B35; --yl: #FFD23F; --gr: #06D6A0;
  --pu: #7B5EA7; --bl: #118AB2; --pk: #FF6B9D;
  --bg: #FFF9F0; --white: #FFFFFF; --text: #2D2D2D;
  --muted: #999; --rad: 18px; --shad: 0 6px 24px rgba(0,0,0,0.09);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* HEADER */
.hdr {
  background: linear-gradient(135deg, #FF6B35 0%, #FF8856 40%, #FFD23F 100%);
  padding: 22px 16px 16px; text-align: center; position: relative; overflow: hidden;
}
.hdr::before { content:''; position:absolute; top:-50px; right:-30px; width:140px; height:140px; background:rgba(255,255,255,.12); border-radius:50%; }
.hdr .badge { display:inline-block; background:rgba(255,255,255,.3); color:white; font-size:10px; font-weight:900; letter-spacing:2px; text-transform:uppercase; padding:3px 12px; border-radius:20px; margin-bottom:6px; }
.hdr h1 { font-family:'Fredoka One',cursive; font-size:30px; color:white; text-shadow:0 3px 10px rgba(0,0,0,.15); line-height:1.1; }
.hdr p { color:rgba(255,255,255,.9); font-size:13px; font-weight:700; margin-top:4px; }

/* DAY PICKER */
.daypick { background:white; padding:12px 16px; border-bottom:2px solid #F0E8D8; }
.daypick-label { font-size:11px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.days-row { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
.day-btn {
  flex-shrink:0; width:44px; height:54px; border-radius:14px; border:2px solid #E8E0D0;
  background:white; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px; transition:all .15s;
  font-family:'Nunito',sans-serif;
}
.day-btn .d-num { font-size:16px; font-weight:900; color:var(--muted); }
.day-btn .d-lbl { font-size:9px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
.day-btn.active { background:var(--or); border-color:var(--or); }
.day-btn.active .d-num, .day-btn.active .d-lbl { color:white; }
.day-btn.done { background:#E8FBF5; border-color:var(--gr); }
.day-btn.done .d-num { color:var(--gr); }
.day-btn.done .d-lbl { color:var(--gr); }
.day-btn.locked { opacity:.45; cursor:not-allowed; }

/* PROGRESS BAR */
.prog-bar { background:white; padding:10px 16px; display:flex; align-items:center; gap:10px; border-bottom:2px solid #F0E8D8; }
.pb-track { flex:1; background:#F0E8D8; border-radius:10px; height:10px; overflow:hidden; }
.pb-fill { height:100%; background:linear-gradient(90deg,var(--or),var(--yl)); border-radius:10px; transition:width .6s; }
.pb-pct { font-size:12px; font-weight:900; color:var(--or); min-width:36px; text-align:right; }

/* CONTENT */
.content { padding:16px; }

/* CARD */
.card { background:white; border-radius:var(--rad); padding:18px; margin-bottom:14px; box-shadow:var(--shad); }
.card-title { font-family:'Fredoka One',cursive; font-size:17px; color:var(--or); margin-bottom:12px; display:flex; align-items:center; gap:8px; }

/* TIMER */
.timer-wrap { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.timer-box { background:linear-gradient(135deg,var(--pu),var(--bl)); color:white; border-radius:12px; padding:8px 16px; font-family:'Fredoka One',cursive; font-size:22px; min-width:70px; text-align:center; }
.timer-label { font-size:12px; font-weight:800; color:var(--muted); }
.timer-start { padding:8px 16px; background:var(--gr); color:white; border:none; border-radius:12px; font-family:'Fredoka One',cursive; font-size:15px; cursor:pointer; }

/* SIBUDIAM MINI */
.sib-mini { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.sib-chip { border-radius:10px; padding:6px 10px; font-size:12px; font-weight:800; display:flex; align-items:center; gap:4px; }
.sc-si { background:#FFF0EB; color:#FF6B35; }
.sc-bu { background:#FFF8E1; color:#F59E0B; }
.sc-di { background:#E8FBF5; color:#059669; }
.sc-a  { background:#EEF4FF; color:#2563EB; }
.sc-m  { background:#F3EEFF; color:#7B5EA7; }

/* VOCAB CARDS */
.vocab-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
.vocab-card { border-radius:12px; padding:12px; text-align:center; cursor:pointer; transition:transform .15s; }
.vocab-card:hover { transform:scale(1.03); }
.vocab-card .vc-emoji { font-size:28px; }
.vocab-card .vc-word { font-size:13px; font-weight:900; margin-top:4px; }
.vocab-card .vc-type { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; opacity:.6; }

/* QUESTION */
.q-wrap { margin-bottom:16px; }
.q-num { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; font-size:12px; font-weight:900; color:white; background:var(--or); margin-right:8px; flex-shrink:0; }
.q-text { font-size:14px; font-weight:700; line-height:1.5; display:flex; align-items:flex-start; margin-bottom:8px; }
.opts { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
.opt { padding:9px 8px; border:2px solid #E8E0D0; border-radius:12px; background:white; font-family:'Nunito',sans-serif; font-size:13px; font-weight:700; cursor:pointer; transition:all .12s; text-align:center; }
.opt:hover { border-color:var(--or); background:#FFF0EB; }
.opt.sel { border-color:var(--bl); background:#EEF4FF; }
.opt.cor { border-color:var(--gr); background:#E8FBF5; color:#065F46; }
.opt.wrg { border-color:#EF4444; background:#FEF2F2; color:#991B1B; }
.fb { font-size:12px; font-weight:700; padding:6px 10px; border-radius:8px; margin-top:6px; display:none; }
.fb.cor { background:#D1FAE5; color:#065F46; display:block; }
.fb.wrg { background:#FEE2E2; color:#991B1B; display:block; }

/* WRITE */
.wi { width:100%; border:2px solid #E8E0D0; border-radius:12px; padding:10px 14px; font-family:'Nunito',sans-serif; font-size:14px; font-weight:600; outline:none; transition:border-color .2s; margin-top:6px; }
.wi:focus { border-color:var(--or); }
.wi.cor { border-color:var(--gr); background:#E8FBF5; }
.wi.wrg { border-color:#EF4444; background:#FEF2F2; }

/* SCORE PANEL */
.score-panel { border-radius:var(--rad); padding:22px; text-align:center; margin-bottom:14px; display:none; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
.score-panel.show { display:block; }
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.sp-emoji { font-size:50px; display:block; margin-bottom:6px; }
.sp-num { font-family:'Fredoka One',cursive; font-size:44px; line-height:1; }
.sp-label { font-size:13px; font-weight:700; opacity:.85; margin-top:4px; }
.sp-msg { font-size:16px; font-weight:800; margin-top:10px; padding:10px; border-radius:12px; background:rgba(255,255,255,.25); }
.sp-bar { height:12px; border-radius:10px; overflow:hidden; background:rgba(255,255,255,.25); margin-top:14px; }
.sp-fill { height:100%; background:var(--yl); border-radius:10px; transition:width 1s; }

/* STARS */
.stars-earned { display:flex; justify-content:center; gap:8px; margin:12px 0; }
.star-item { font-size:28px; filter:grayscale(1) opacity(.3); transition:filter .4s; }
.star-item.lit { filter:none; animation:starPop .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes starPop { from{transform:scale(0)} to{transform:scale(1)} }

/* PYRAMID */
.pyramid { display:flex; flex-direction:column; align-items:center; gap:6px; margin:8px 0; }
.pyr { border-radius:12px; padding:10px 20px; text-align:center; font-weight:800; font-size:13px; position:relative; transition:all .3s; }
.pyr.locked { filter:grayscale(1); opacity:.35; }
.pyr.open { box-shadow:0 4px 16px rgba(0,0,0,.1); }
.pyr-1 { width:85%; background:linear-gradient(135deg,var(--or),#FF8C42); color:white; }
.pyr-2 { width:68%; background:linear-gradient(135deg,var(--yl),#FFBA08); color:#333; }
.pyr-3 { width:52%; background:linear-gradient(135deg,var(--gr),#059669); color:white; }
.pyr .pyr-title { font-family:'Fredoka One',cursive; font-size:15px; }
.pyr .pyr-sub { font-size:11px; margin-top:2px; }
.pyr .lock-icon { font-size:16px; margin-top:4px; }

/* BUTTONS */
.btn-main { width:100%; padding:15px; border:none; border-radius:var(--rad); font-family:'Fredoka One',cursive; font-size:19px; color:white; cursor:pointer; transition:transform .12s, box-shadow .12s; margin-top:6px; }
.btn-or { background:linear-gradient(135deg,var(--or),#FF8C42); box-shadow:0 6px 20px rgba(255,107,53,.3); }
.btn-gr { background:linear-gradient(135deg,var(--gr),#059669); box-shadow:0 6px 20px rgba(6,214,160,.3); }
.btn-pu { background:linear-gradient(135deg,var(--pu),var(--bl)); box-shadow:0 6px 20px rgba(123,94,167,.3); }
.btn-wa { background:linear-gradient(135deg,#25D366,#128C7E); box-shadow:0 6px 20px rgba(37,211,102,.25); }
.btn-main:hover { transform:translateY(-2px); }
.btn-main:active { transform:translateY(0); }

/* EXAMPLE AYAT */
.eg-box { background:linear-gradient(135deg,#EEF4FF,#E8FBF5); border-radius:14px; padding:14px; margin:8px 0; }
.eg-lbl { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:1px; color:var(--bl); margin-bottom:6px; }
.eg-txt { font-size:14px; font-weight:700; line-height:1.6; }
.hl { background:var(--yl); border-radius:4px; padding:0 4px; color:#333; }

/* TIP BOX */
.tip { background:#F3EEFF; border-left:4px solid var(--pu); border-radius:0 12px 12px 0; padding:12px; margin:10px 0; font-size:13px; font-weight:600; color:#4A3870; line-height:1.6; }
.tip strong { color:var(--pu); }

/* REPORT CARD */
.rpt-hdr { background:linear-gradient(135deg,var(--pu),var(--bl)); padding:20px; text-align:center; border-radius:var(--rad) var(--rad) 0 0; color:white; }
.rpt-hdr h2 { font-family:'Fredoka One',cursive; font-size:20px; }
.rpt-hdr p { font-size:12px; opacity:.85; margin-top:4px; }
.rpt-body { background:white; border-radius:0 0 var(--rad) var(--rad); padding:18px; }
.rpt-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px dashed #F0E8D8; font-size:13px; }
.rpt-row:last-child { border-bottom:none; }
.rpt-key { font-weight:700; color:var(--muted); }
.rpt-val { font-weight:900; }
.grade-tag { display:inline-block; padding:3px 12px; border-radius:20px; font-weight:900; font-size:12px; }
.gA { background:#D1FAE5; color:#065F46; }
.gB { background:#DBEAFE; color:#1E40AF; }
.gC { background:#FEF3C7; color:#92400E; }
.gD { background:#FEE2E2; color:#991B1B; }
.skill-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
.sk { border-radius:12px; padding:10px; }
.sk-si { background:#FFF0EB; } .sk-bu { background:#FFF8E1; } .sk-di { background:#E8FBF5; } .sk-am { background:#F3EEFF; }
.sk .si { font-size:18px; }
.sk .sn { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.5px; margin:3px 0 5px; }
.sk .sb { background:#F0F0F0; border-radius:8px; height:7px; overflow:hidden; }
.sk .sf { height:100%; border-radius:8px; }
.sf-si { background:var(--or); } .sf-bu { background:#F59E0B; } .sf-di { background:var(--gr); } .sf-am { background:var(--pu); }
.note-box { background:#FFF9F0; border-left:4px solid var(--yl); border-radius:0 12px 12px 0; padding:12px; margin-top:12px; font-size:12px; font-weight:600; color:#555; line-height:1.6; }
.note-box strong { color:var(--or); }
.sig-box { background:#F3EEFF; border-radius:14px; padding:14px; margin-top:12px; }
.sig-line { border-bottom:2px solid #C4A8E0; height:36px; margin-bottom:6px; }
.sig-date { font-size:11px; color:var(--muted); font-weight:700; }

/* CERTIFICATE */
.cert {
  background:white; border-radius:var(--rad); padding:28px 20px;
  box-shadow: 0 0 0 3px var(--yl), 0 0 0 6px var(--or), var(--shad);
  text-align:center; position:relative; overflow:hidden; margin-bottom:14px;
}
.cert::before {
  content:''; position:absolute; top:0; left:0; right:0; height:8px;
  background:linear-gradient(90deg, var(--or), var(--yl), var(--gr), var(--bl), var(--pu), var(--pk), var(--or));
}
.cert-logo { font-size:48px; margin-bottom:8px; }
.cert-title { font-family:'Fredoka One',cursive; font-size:24px; color:var(--or); }
.cert-subtitle { font-size:12px; font-weight:800; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin:4px 0 16px; }
.cert-name { font-family:'Fredoka One',cursive; font-size:28px; color:var(--text); border-bottom:3px solid var(--yl); display:inline-block; padding:0 20px 4px; margin:8px 0; }
.cert-desc { font-size:13px; font-weight:700; color:#555; line-height:1.7; margin:12px 0 16px; }
.cert-badges { display:flex; justify-content:center; gap:12px; margin:12px 0; flex-wrap:wrap; }
.cert-badge { border-radius:12px; padding:8px 14px; font-size:12px; font-weight:800; }
.cb1 { background:#FFF0EB; color:var(--or); }
.cb2 { background:#FFF8E1; color:#B45309; }
.cb3 { background:#E8FBF5; color:#065F46; }
.cert-stars { font-size:28px; margin:8px 0; letter-spacing:4px; }
.cert-footer { display:flex; justify-content:space-between; align-items:flex-end; margin-top:20px; padding-top:16px; border-top:1px dashed #F0E8D8; }
.cert-sign { text-align:center; }
.cert-sign .cs-line { border-bottom:2px solid #C4A8E0; width:120px; margin:0 auto 4px; height:28px; }
.cert-sign .cs-name { font-size:11px; font-weight:900; color:var(--muted); }
.cert-date { font-size:11px; font-weight:700; color:var(--muted); text-align:center; }

/* CONFETTI */
.conf-wrap { position:fixed; top:0; left:0; right:0; bottom:0; pointer-events:none; z-index:1000; display:none; }
.conf-p { position:absolute; border-radius:2px; animation:confFall 3s ease-in forwards; }
@keyframes confFall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }

/* WEEKLY TRACKER */
.wk-track { display:flex; gap:0; margin:8px 0; }
.wk-seg { flex:1; height:8px; background:#F0E8D8; }
.wk-seg:first-child { border-radius:8px 0 0 8px; }
.wk-seg:last-child  { border-radius:0 8px 8px 0; }
.wk-seg.done { background:var(--gr); }
.wk-seg.active { background:var(--or); }

/* STREAK */
.streak-row { display:flex; gap:6px; margin:8px 0; justify-content:center; }
.streak-day { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; border:2px solid #E8E0D0; }
.streak-day.done { background:#E8FBF5; border-color:var(--gr); }
.streak-day.today { background:var(--or); border-color:var(--or); }
.streak-day.locked { background:#F9F9F9; opacity:.5; }

/* MOTIVATION QUOTE */
.quote-box { background:linear-gradient(135deg,#EEF4FF,#F3EEFF); border-radius:14px; padding:14px; text-align:center; margin:10px 0; }
.quote-text { font-size:13px; font-weight:700; color:var(--pu); font-style:italic; line-height:1.6; }
.quote-auth { font-size:11px; font-weight:900; color:var(--muted); margin-top:6px; }

/* NAME INPUT */
.name-input { width:100%; border:2px solid var(--yl); border-radius:12px; padding:10px 14px; font-family:'Nunito',sans-serif; font-size:16px; font-weight:700; outline:none; text-align:center; }
.name-input:focus { border-color:var(--or); }
</style>
</head>
<body>

<div class="conf-wrap" id="confWrap"></div>

<!-- HEADER -->
<div class="hdr">
  <div class="badge">✨ Ohsem BM – Tahun 1 & 2</div>
  <h1>SiBuDiAM<br>7 Hari Hebat!</h1>
  <p>Tema: Keluarga Saya 👨‍👩‍👧‍👦 · Latihan 5 Minit Sehari</p>
</div>

<!-- DAY PICKER -->
<div class="daypick">
  <div class="daypick-label">Pilih Hari</div>
  <div class="days-row" id="daysRow">
    <!-- injected by JS -->
  </div>
</div>

<!-- WEEKLY TRACKER -->
<div style="padding:10px 16px; background:white; border-bottom:2px solid #F0E8D8;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
    <span style="font-size:11px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:1px;">Kemajuan Minggu</span>
    <span style="font-size:12px; font-weight:900; color:var(--or);" id="weekPct">0%</span>
  </div>
  <div class="wk-track" id="wkTrack">
    <div class="wk-seg active"></div><div class="wk-seg"></div><div class="wk-seg"></div>
    <div class="wk-seg"></div><div class="wk-seg"></div><div class="wk-seg"></div><div class="wk-seg"></div>
  </div>
  <div class="streak-row" id="streakRow">
    <!-- injected -->
  </div>
</div>

<!-- CONTENT AREA -->
<div class="content" id="mainContent">
  <!-- injected by JS -->
</div>

<script>
// ===========================
// STATE
// ===========================
let currentDay = 1;
let dayScores = { 1:null, 2:null, 3:null, 4:null, 5:null, 6:null, 7:null };
let quizAnswers = {};
let quizDone = false;
let timerInterval = null;
let timerSec = 300;
let timerRunning = false;
let studentName = '';

const dayConfig = [
  { day:1, label:'Isnin', icon:'📖', type:'belajar',
    title:'Kenali SiBuDiAM', subtitle:'Belajar unsur Si + Bu' },
  { day:2, label:'Selasa', icon:'✏️', type:'latihan',
    title:'Latihan Si + Bu', subtitle:'Bina ayat 2 unsur' },
  { day:3, label:'Rabu', icon:'🗺️', type:'belajar',
    title:'Unsur "Di Mana"', subtitle:'Tambah lokasi dalam ayat' },
  { day:4, label:'Khamis', icon:'✏️', type:'latihan',
    title:'Latihan Di + A', subtitle:'Latihan 3-4 unsur' },
  { day:5, label:'Jumaat', icon:'🎯', type:'kuiz',
    title:'Kuiz Pertengahan', subtitle:'5 soalan pilihan' },
  { day:6, label:'Sabtu', icon:'🏆', type:'kuiz',
    title:'Kuiz Akhir Minggu', subtitle:'10 soalan lengkap' },
  { day:7, label:'Ahad', icon:'🎓', type:'sijil',
    title:'Hari Sijil!', subtitle:'Tahniah, kamu dah habis!' },
];

const quotes = [
  { text:'"Belajar ketika kecil bagai mengukir di atas batu."', auth:'— Peribahasa Melayu' },
  { text:'"Setiap hari kamu belajar, kamu makin bijak!"', auth:'— Cikgu Zainal' },
  { text:'"Usaha tangga kejayaan. Teruskan!"', auth:'— Peribahasa Melayu' },
  { text:'"Jangan takut silap. Silap pun boleh belajar!"', auth:'— Cikgu Zainal' },
  { text:'"Rajin pangkal pandai!"', auth:'— Peribahasa Melayu' },
  { text:'"Sikit-sikit, lama-lama jadi bukit!"', auth:'— Peribahasa Melayu' },
  { text:'"Hari ini lebih baik dari semalam. Terus maju!"', auth:'— Cikgu Zainal' },
];

// ===========================
// RENDER SHELL
// ===========================
function renderDayPicker() {
  const row = document.getElementById('daysRow');
  row.innerHTML = dayConfig.map(d => {
    let cls = 'day-btn';
    if (d.day === currentDay) cls += ' active';
    else if (dayScores[d.day] !== null) cls += ' done';
    const icon = dayScores[d.day] !== null ? '✅' : d.icon;
    return `<button class="${cls}" onclick="switchDay(${d.day})">
      <span class="d-num">${d.day}</span>
      <span class="d-lbl">${d.label}</span>
    </button>`;
  }).join('');
}

function renderStreak() {
  const emojis = ['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣'];
  document.getElementById('streakRow').innerHTML = dayConfig.map(d => {
    let cls = 'streak-day';
    if (dayScores[d.day] !== null) cls += ' done';
    else if (d.day === currentDay) cls += ' today';
    else cls += ' locked';
    const inner = dayScores[d.day] !== null ? '✅' : (d.day === currentDay ? '▶' : '🔒');
    return `<div class="${cls}">${inner}</div>`;
  }).join('');
}

function renderWeekProgress() {
  const done = Object.values(dayScores).filter(v => v !== null).length;
  const pct = Math.round((done/7)*100);
  document.getElementById('weekPct').textContent = pct + '%';
  const segs = document.querySelectorAll('.wk-seg');
  segs.forEach((s, i) => {
    s.className = 'wk-seg';
    if (i < done) s.classList.add('done');
    else if (i === done) s.classList.add('active');
  });
}

function switchDay(d) {
  currentDay = d;
  quizAnswers = {};
  quizDone = false;

// ===========================
// TIMER
// ===========================
function startTimer() {
  if (timerRunning) return;
  timerSec = 300;
  timerRunning = true;
  timerInterval = setInterval(() => {
    timerSec--;
    updateTimerDisplay();
    if (timerSec <= 0) { stopTimer(); }
  }, 1000);
  document.querySelector('.timer-start').textContent = 'Sedang berjalan...';
}
function stopTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
}
function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  if (!el) return;
  const m = Math.floor(timerSec/60);
  const s = timerSec % 60;
  el.textContent = m + ':' + String(s).padStart(2,'0');
  if (timerSec <= 60) el.style.color = '#EF4444';
}

// ===========================
// ANSWER CHECKING
// ===========================
function selectOpt(btn, qid, chosen, correct) {
  const parent = btn.closest('.q-wrap');
  parent.querySelectorAll('.opt').forEach(b => b.classList.remove('sel','cor','wrg'));
  const fb = document.getElementById('fb-'+qid);
  if (chosen === correct) {
    btn.classList.add('cor');
    fb.textContent = '✅ Betul! Hebat!';
    fb.className = 'fb cor';
    quizAnswers[qid] = true;
  } else {
    btn.classList.add('wrg');
    fb.textContent = '❌ Jawapan: ' + correct;
    fb.className = 'fb wrg';
    parent.querySelectorAll('.opt').forEach(b => {
      if (b.textContent.trim() === correct) b.classList.add('cor');
    });
    quizAnswers[qid] = false;
  }
}

function checkWrite(inp, accepted, qid) {
  const val = inp.value.toLowerCase().trim();
  const fb = document.getElementById('fb-'+qid);
  if (!val) return;
  const ok = accepted.some(a => val.includes(a.toLowerCase()));
  if (ok) {
    inp.classList.add('cor'); inp.classList.remove('wrg');
    if (fb) { fb.textContent='✅ Bagus! Jawapan diterima!'; fb.className='fb cor'; }
    quizAnswers[qid] = true;
    // Remove retry btn if exists
    const rb = document.getElementById('retry-'+qid);
    if(rb) rb.remove();
  } else if (val.length > 2) {
    inp.classList.add('wrg'); inp.classList.remove('cor');
    if (fb) { fb.innerHTML='💡 Cuba lagi! Contoh: <strong>'+accepted[0]+'</strong>'; fb.className='fb wrg'; }
    quizAnswers[qid] = false;
    // Add retry button if not exists
    if(!document.getElementById('retry-'+qid)) {
      const rb = document.createElement('button');
      rb.id = 'retry-'+qid;
      rb.textContent = '🔄 Cuba Semula';
      rb.style.cssText = 'margin-top:6px;padding:7px 14px;background:#FFF0EB;border:2px solid var(--or);border-radius:10px;font-family:Nunito,sans-serif;font-size:12px;font-weight:800;color:var(--or);cursor:pointer;width:100%;';
      rb.onclick = () => { inp.value=''; inp.classList.remove('wrg','cor'); if(fb){fb.className='fb';fb.textContent='';} rb.remove(); inp.focus(); };
      fb.parentNode.insertBefore(rb, fb.nextSibling);
    }
  }
}

function submitDay(dayNum) {
  const trues = Object.values(quizAnswers).filter(Boolean).length;
  const total = Object.keys(quizAnswers).length || 1;
  const pct = Math.round((trues/total)*100);
  dayScores[dayNum] = pct;
  quizDone = true;

  const sp = document.getElementById('scorePanel');
  if (sp) {
    sp.style.display = 'block';
    document.getElementById('sp-num').textContent = trues+'/'+total;
    document.getElementById('sp-fill').style.width = pct+'%';
    let emoji, msg;
    if(pct>=90){emoji='🏆';msg='LUAR BIASA! Kamu seorang bintang!';}
    else if(pct>=70){emoji='🌟';msg='Bagus sekali! Teruskan!';}
    else if(pct>=50){emoji='👍';msg='Usaha yang baik! Cuba lagi!';}
    else{emoji='💪';msg='Jangan putus asa! Ulang kaji ya!';}
    document.getElementById('sp-emoji').textContent = emoji;
    document.getElementById('sp-msg').textContent = msg;

    // Stars
    const stars = document.querySelectorAll('.star-item');
    let litCount = pct>=90?3:pct>=70?2:pct>=50?1:0;
    stars.forEach((s,i) => {
      if(i<litCount) setTimeout(()=>s.classList.add('lit'),(i+1)*300);
    });

    // Pyramid
    if(pct>=50) unlockPyr(3);
    if(pct>=70) unlockPyr(2);
    if(pct>=90) unlockPyr(1);
    if(pct>=70) launchConf();
  }

  stopTimer();
  renderDayPicker();
  renderStreak();
  renderWeekProgress();

  // Show next day btn
  const nb = document.getElementById('nextDayBtn');
  if(nb) nb.style.display='block';
  const sb = document.getElementById('submitBtn');
  if(sb) sb.style.display='none';
}

function unlockPyr(level) {
  const el = document.getElementById('pyr-'+level);
  if(el){ el.classList.remove('locked'); el.classList.add('open'); const lk=el.querySelector('.lock-icon'); if(lk) lk.textContent='✅'; }
}

// CONFETTI
// ===========================
function launchConf() {
  const w = document.getElementById('confWrap');
  w.style.display = 'block'; w.innerHTML = '';
  const cols = ['#FF6B35','#FFD23F','#06D6A0','#7B5EA7','#118AB2','#FF6B9D'];
  for(let i=0;i<70;i++){
    const el = document.createElement('div');
    el.className='conf-p';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${cols[Math.floor(Math.random()*cols.length)]};animation-delay:${Math.random()*2}s;animation-duration:${2+Math.random()*2}s;width:${6+Math.random()*10}px;height:${6+Math.random()*10}px;`;
    w.appendChild(el);
  }
  setTimeout(()=>w.style.display='none',5000);
}

// ===========================
// REPORT GENERATE
// ===========================
function generateReport() {
  const scores = Object.values(dayScores).filter(v=>v!==null);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  document.getElementById('rpt-avg').textContent = avg + '%';
  const grade = avg>=90?'A+':avg>=80?'A':avg>=70?'B+':avg>=60?'B':avg>=50?'C':'D';
  const gradeEl = document.getElementById('rpt-grade');
  gradeEl.textContent = grade;
  gradeEl.className = 'grade-tag ' + (avg>=70?'gA':avg>=60?'gB':avg>=50?'gC':'gD');
  document.getElementById('rpt-days').textContent = scores.length + ' / 7 hari';
  document.getElementById('rpt-date').textContent = new Date().toLocaleDateString('ms-MY',{year:'numeric',month:'long',day:'numeric'});

  // Skill bars
  document.getElementById('sf-si').style.width = Math.min(avg+10,100)+'%';
  document.getElementById('sf-bu').style.width = Math.min(avg+5,100)+'%';
  document.getElementById('sf-di').style.width = Math.max(avg-10,20)+'%';
  document.getElementById('sf-am').style.width = Math.max(avg-20,15)+'%';

  let note;
  if(avg>=80) note='Anak anda menunjukkan <strong>prestasi cemerlang</strong>! Boleh terus ke Minggu 2 dengan keyakinan.';
  else if(avg>=60) note='Anak anda <strong>memahami asas</strong> SiBuDiAM. Galakkan latihan lisan setiap hari untuk lebih mantap.';
  else note='Anak anda sedang membina asas. Sila <strong>ulang latihan Hari 1-3</strong> bersama-sama sebelum ke Minggu 2.';
  document.getElementById('rpt-note').innerHTML = '<strong>💬 Nota Cikgu:</strong><br>'+note;
}

    <div style="margin-bottom:12px;">
      <div style="font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px;">Nama murid untuk sijil:</div>
      <input class="name-input" id="nameInput" placeholder="Tulis nama murid di sini..." value="${studentName}" oninput="updateCertName(this.value)">
    </div>
    <div style="margin-bottom:4px;">
      <div style="font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px;">Nama ibu / bapa untuk sijil:</div>
      <input class="name-input" id="parentNameInput" placeholder="Tulis nama ibu / bapa di sini..." value="${parentName}" oninput="updateParentCertName(this.value)" style="border-color:#C4A8E0;">
    </div>
  </div>

  <!-- CERTIFICATE -->
  <div class="cert" id="certCard">
    <div class="cert-logo">🏆</div>
    <div class="cert-title">Sijil Pencapaian</div>
    <div class="cert-subtitle">Ohsem BM · SiBuDiAM Minggu 1</div>
    <p style="font-size:12px;font-weight:700;color:var(--muted);">Ini adalah untuk mengiktiraf bahawa</p>
    <div class="cert-name" id="certName">${nm}</div>
    <div class="cert-desc">
      telah berjaya menyiapkan modul<br>
      <strong>SiBuDiAM – Tema Keluarga Saya</strong><br>
      dengan penuh semangat dan dedikasi selama 7 hari.
    </div>
    <div class="cert-badges">
      <span class="cert-badge cb1">✅ ${daysCompleted}/7 Hari</span>
      <span class="cert-badge cb2">🎯 Purata ${avg}%</span>
      <span class="cert-badge cb3">📚 Teknik SiBuDiAM</span>
    </div>
    <div class="cert-stars">⭐⭐⭐</div>
    <div class="cert-footer">
      <div class="cert-sign">
        <div class="cs-line" style="position:relative;">
          <span style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:18px;">✍️</span>
        </div>
        <div class="cs-name">CIKGU ZAINAL ZULHILMI<br><span style="color:var(--or)">Ohsem BM</span></div>
      </div>
      <div class="cert-date">📅 ${today}</div>
      <div class="cert-sign">
        <div class="cs-line"></div>
        <div class="cs-name" id="certParentName">${parentName ? parentName+'<br><span style="color:var(--muted);font-size:10px">IBU / BAPA</span>' : 'IBU / BAPA<br>_______________'}</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📊 Ringkasan Pencapaian 7 Hari</div>
    <div id="weekSummary">
      ${dayConfig.slice(0,6).map(d=>`
        <div class="rpt-row">
          <span class="rpt-key">${d.icon} Hari ${d.day} – ${d.title}</span>
          <span class="rpt-val">${dayScores[d.day]!==null ? dayScores[d.day]+'%' : '—'}</span>
        </div>`).join('')}
    </div>
  </div>

  <button class="btn-main btn-wa" onclick="shareCert()">📲 Kongsi Sijil ke WhatsApp 🎉</button>
  <button class="btn-main btn-pu" style="margin-top:8px" onclick="window.location.href='ohsem_minggu2_sekolah.html'">
    Terus ke Minggu 2 🚀
  </button>`;
}

function updateCertName(val) {
  studentName = val;
  const cn = document.getElementById('certName');
  if(cn) cn.textContent = val || '_______________';
}

function updateParentCertName(val) {
  parentName = val;
  const el = document.getElementById('certParentName');
  if(el) el.innerHTML = (val||'_______________')+'<br><span style="color:var(--muted);font-size:10px">IBU / BAPA</span>';
}

function updateParentName(val) {
  parentName = val;
  // Sync to cert if on day 7
  const el = document.getElementById('certParentName');
  if(el) el.innerHTML = (val||'_______________')+'<br><span style="color:var(--muted);font-size:10px">IBU / BAPA</span>';
  const pi = document.getElementById('parentNameInput');
  if(pi) pi.value = val;
}

function shareCert() {
  const scores = Object.values(dayScores).filter(v=>v!==null);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  const nm = studentName || 'Murid';
  const msg = encodeURIComponent(
    '🎓 *Sijil Pencapaian – Ohsem BM*\n\n'+
    '🏆 Tahniah! '+nm+' telah berjaya menyiapkan\n'+
    '*SiBuDiAM Minggu 1 – Tema Keluarga!*\n\n'+
    '📅 Hari Diselesaikan: '+scores.length+' / 7\n'+
    '🎯 Purata Markah: '+avg+'%\n'+
    '⭐⭐⭐ Pencapaian Luar Biasa!\n\n'+
    '✨ *Ohsem BM* – Belajar Sambil Seronok!\n'+
    '📱 Cikgu Zainal'
  );
  window.open('https://wa.me/?text='+msg,'_blank');
}

function sayWord(w) {
  if('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(w);
    u.lang='ms-MY'; u.rate=0.8;
    speechSynthesis.speak(u);
  }
}

function updateParentName(val) {
  const el = document.getElementById('certParentName');
  if(el) el.innerHTML = (val || '_______________') + '<br><span style="color:var(--pu);font-size:10px">IBU / BAPA</span>';
}

// ===========================
// INIT
// ===========================
// Set sig date
const sigDateEl = document.getElementById('sigDate');
if(sigDateEl) sigDateEl.textContent = new Date().toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'});

renderDayPicker();
renderStreak();
renderWeekProgress();
renderContent();
</script>
</body>
</html>
